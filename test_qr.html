<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Decodificar QRCode NFC-e</title>
  <style>
    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f8fafc; margin:24px}
    .wrap{max-width:880px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:18px}
    h1{margin:0 0 10px;font-size:20px}
    .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
    .col{flex:1}
    label{font-weight:700;display:block;margin:8px 0 6px}
    input[type=file]{border:2px dashed #e5e7eb;border-radius:10px;padding:14px;background:#f9fafb;width:100%}
    canvas{display:none}
    pre{background:#0b1020;color:#c7d2fe;border-radius:8px;padding:12px;overflow:auto}
    a{color:#2563eb;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Decodificar QRCode da NFC-e</h1>
    <p>Envie uma foto nítida do QRCode (ou um print recortado do QR).</p>
    <div class="row">
      <div class="col">
        <label>Imagem do QRCode</label>
        <input id="file" type="file" accept="image/*"/>
      </div>
      <div>
        <button id="btn" style="padding:10px 14px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700">Decodificar</button>
      </div>
    </div>
    <p id="hint" style="color:#374151;margin-top:8px"></p>
    <div id="result" style="margin-top:12px;display:none">
      <h3 style="margin:6px 0">Resultado</h3>
      <div id="link"></div>
      <pre id="out"></pre>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const elFile = document.getElementById('file');
    const elBtn = document.getElementById('btn');
    const elHint = document.getElementById('hint');
    const elOut = document.getElementById('out');
    const elLink = document.getElementById('link');
    const elRes = document.getElementById('result');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function decode(){
      elRes.style.display = 'none';
      elHint.textContent = '';
      const f = elFile.files && elFile.files[0];
      if(!f){ elHint.textContent = 'Selecione uma imagem com o QRCode.'; return; }
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width; canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if(code && code.data){
          const data = code.data.trim();
          elRes.style.display = 'block';
          elOut.textContent = data;
          try{
            const u = new URL(data);
            elLink.innerHTML = 'Abrir: <a href="'+u.href+'" target="_blank" rel="noopener">'+u.hostname+u.pathname+'?'+u.searchParams.toString()+'</a>';
          }catch(e){ elLink.textContent = ''; }
        } else {
          elHint.textContent = 'Não foi possível ler o QR. Tente recortar a imagem apenas no quadrado do QR, com boa iluminação.';
        }
      };
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.readAsDataURL(f);
    }
    elBtn.addEventListener('click', decode);
  </script>
</body>
</html>
